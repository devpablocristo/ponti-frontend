# Lefthook config — pre-commit hooks para ponti-frontend.
#
# Instalación (una vez por dev):
#   brew install lefthook       # macOS
#   sudo apt install lefthook   # Debian/Ubuntu
#   # Luego en el repo:
#   lefthook install
#
# Para correr a mano: `lefthook run pre-commit`.
# Para bypass en emergencia: `git commit --no-verify` (NO usar de rutina).

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "ui/src/**/*.{ts,tsx}"
      run: cd ui && yarn eslint {staged_files}

    typecheck:
      glob: "ui/src/**/*.{ts,tsx}"
      # tsc es full-project; corremos si hay TS staged.
      run: cd ui && yarn tsc -b --noEmit 2>/dev/null || yarn tsc -b

pre-push:
  commands:
    tests:
      run: cd ui && yarn vitest run --passWithNoTests
