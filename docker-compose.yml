services:
  ponti-frontend-volumes:
    image: node:20.19.0
    user: "0:0"
    command: sh -c "mkdir -p /ui-node-modules /bff-node-modules /yarn-cache && chown -R ${UID:-1000}:${GID:-1000} /ui-node-modules /bff-node-modules /yarn-cache"
    volumes:
      - ui_node_modules:/ui-node-modules
      - bff_node_modules:/bff-node-modules
      - yarn_cache:/yarn-cache
    networks:
      - fe-network
    restart: "no"

  ponti-ui:
    image: node:20.19.0
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: sh -c "if [ ! -f node_modules/.yarn-integrity ] || [ ! -d node_modules/@devpablocristo/core-authn ] || [ ! -d node_modules/@devpablocristo/core-browser ] || [ ! -d node_modules/@devpablocristo/core-http ] || [ ! -d node_modules/@devpablocristo/modules-ai-console ] || [ ! -d node_modules/@devpablocristo/modules-ui-data-display ] || [ ! -d node_modules/@devpablocristo/modules-ui-filters ] || [ ! -d node_modules/@devpablocristo/modules-ui-forms ] || [ ! -d node_modules/xlsx ]; then yarn install --frozen-lockfile --network-timeout 600000 --network-concurrency 1; fi && yarn dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
      - yarn_cache:/yarn-cache
    # Vite lee `./ui/.env` (montado). Evitar hardcodear infra acá.
    environment:
      # Cross-platform: la UI habla con el BFF por red interna de Docker.
      - BFF_URL=http://ponti-bff:3000
      - YARN_CACHE_FOLDER=/yarn-cache
    depends_on:
      ponti-frontend-volumes:
        condition: service_completed_successfully
      ponti-bff:
        condition: service_started
    networks:
      - fe-network
    restart: unless-stopped

  ponti-bff:
    image: node:20.19.0
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    command: sh -c "if [ ! -f node_modules/.yarn-integrity ]; then yarn install --frozen-lockfile --network-timeout 600000 --network-concurrency 1; fi && yarn dev"
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - bff_node_modules:/app/node_modules
      - yarn_cache:/yarn-cache
    env_file:
      - ./api/.env
    environment:
      - NODE_ENV=development
      # Detalle seguro en JSON de errores BFF (p. ej. /ai/chat/stream); no usar en prod expuesto.
      - BFF_VERBOSE_ERRORS=true
      - YARN_CACHE_FOLDER=/yarn-cache
      # El backend (Go) corre en el host. Desde contenedor, usar host.docker.internal.
      # Si tu backend está en otro host/puerto, ajustarlo acá o en ./api/.env.
      - BASE_MANAGER_API=http://host.docker.internal:8080/api/v1
      # nodemon por polling: evita ENOSPC del límite de inotify watchers del host.
      - CHOKIDAR_USEPOLLING=true
      # ENABLE_MOCKS=1 solo para testing sin backend. NUNCA activar en local con stack real.
      # - ENABLE_MOCKS=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ponti-frontend-volumes:
        condition: service_completed_successfully
    networks:
      - fe-network
    restart: unless-stopped

networks:
  fe-network:
    driver: bridge

volumes:
  ui_node_modules:
  bff_node_modules:
  yarn_cache:
