name: Deploy Frontend STAGING (Cloud Run + Hosting)

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "ui/**"
      - "Dockerfile.api"
      - "scripts/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o ref a desplegar (default: main)"
        required: false
        default: "main"

concurrency:
  group: ponti-frontend-deploy-staging-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  REGION: us-central1
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: ponti-frontend-registry
  REQUIRE_AUTH_SMOKE: "0"
  HOSTING_SITE_ID: ${{ vars.FIREBASE_HOSTING_SITE_STG || 'ponti-frontend-stg' }}

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref_name }}

      - name: Resolve deploy SHA
        run: |
          set -euo pipefail
          deploy_sha="$(git rev-parse HEAD)"
          if [[ ! "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: invalid deploy SHA: $deploy_sha"
            exit 1
          fi
          build_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          echo "DEPLOY_SHA=$deploy_sha" >> "$GITHUB_ENV"
          echo "DEPLOY_SHORT_SHA=${deploy_sha::12}" >> "$GITHUB_ENV"
          echo "SERVICE_GIT_SHA=$deploy_sha" >> "$GITHUB_ENV"
          echo "SERVICE_BUILD_TIME=$build_time" >> "$GITHUB_ENV"
          echo "RELEASE_SERVICE_VERSION=stg-${deploy_sha::12}" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_STG }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT_STG }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID_STG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: yarn
          cache-dependency-path: ui/yarn.lock

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker "${{ env.REGISTRY }}" --quiet

      - name: Build frontend
        run: |
          corepack enable
          yarn --cwd ui install --frozen-lockfile
          yarn --cwd ui build

      - name: Package UI artifact
        run: |
          artifact_name="ponti-ui-dist-${DEPLOY_SHA}"
          tar -czf "/tmp/${artifact_name}.tgz" -C ui/dist .
          echo "UI_ARTIFACT_NAME=${artifact_name}" >> "$GITHUB_ENV"
          echo "UI_ARTIFACT_PATH=/tmp/${artifact_name}.tgz" >> "$GITHUB_ENV"

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UI_ARTIFACT_NAME }}
          path: ${{ env.UI_ARTIFACT_PATH }}
          retention-days: 90

      - name: Build Docker image (API only)
        run: |
          IMAGE_SHA="${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID_STG }}/${{ env.REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE_FRONTEND_STG }}:${DEPLOY_SHA}"
          IMAGE_STG="${{ env.REGISTRY }}/${{ vars.GCP_PROJECT_ID_STG }}/${{ env.REPOSITORY }}/${{ vars.CLOUD_RUN_SERVICE_FRONTEND_STG }}:stg"
          docker build -f Dockerfile.api -t "$IMAGE_SHA" .
          docker tag "$IMAGE_SHA" "$IMAGE_STG"
          echo "IMAGE_SHA=$IMAGE_SHA" >> "$GITHUB_ENV"
          echo "IMAGE_STG=$IMAGE_STG" >> "$GITHUB_ENV"

      - name: Resolve canonical backend API URL (STAGING)
        id: backend
        run: |
          backend_service_name="${{ vars.CLOUD_RUN_SERVICE_BACKEND_STG || 'ponti-backend' }}"
          backend_url="$(gcloud run services describe "$backend_service_name" \
            --project="${{ vars.GCP_PROJECT_ID_STG }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)')"
          if [[ -z "$backend_url" ]]; then
            echo "ERROR: no se pudo resolver status.url del backend STAGING '$backend_service_name'."
            exit 1
          fi
          base_manager_api="${backend_url%/}/api/v1"
          if [[ "$base_manager_api" == *"---"* ]]; then
            echo "ERROR: BASE_MANAGER_API STAGING no puede apuntar a URL taggeada: $base_manager_api"
            exit 1
          fi
          echo "BASE_MANAGER_API=$base_manager_api" >> "$GITHUB_OUTPUT"

      - name: Push Docker image
        run: |
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_STG"

      - name: Deploy API to Cloud Run (STAGING)
        run: |
          gcloud run deploy "${{ vars.CLOUD_RUN_SERVICE_FRONTEND_STG }}" \
            --project="${{ vars.GCP_PROJECT_ID_STG }}" \
            --region="${{ env.REGION }}" \
            --image="$IMAGE_SHA" \
            --service-account="${{ vars.CLOUD_RUN_SERVICE_ACCOUNT_STG }}" \
            --allow-unauthenticated \
            --port=3000 \
            --set-env-vars="NODE_ENV=staging,SERVICE_NAME=${{ vars.CLOUD_RUN_SERVICE_FRONTEND_STG }},SERVICE_VERSION=${RELEASE_SERVICE_VERSION},SERVICE_GIT_SHA=${SERVICE_GIT_SHA},SERVICE_BUILD_TIME=${SERVICE_BUILD_TIME},BASE_MANAGER_API=${{ steps.backend.outputs.BASE_MANAGER_API }},X_API_KEY=${{ secrets.X_API_KEY }},IDENTITY_PLATFORM_API_KEY=${{ secrets.IDENTITY_PLATFORM_API_KEY_STG }},IDENTITY_PLATFORM_PROJECT_ID=${{ vars.GCP_PROJECT_ID_STG }}"

      - name: "Guardrail: verify BASE_MANAGER_API detagged (STAGING)"
        run: |
          service_json="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE_FRONTEND_STG }}" \
            --project="${{ vars.GCP_PROJECT_ID_STG }}" \
            --region="${{ env.REGION }}" \
            --format='json(spec.template.spec.containers[0].env)')"
          deployed_base_manager_api="$(SERVICE_JSON="$service_json" python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["SERVICE_JSON"])
          envs = data.get("spec", {}).get("template", {}).get("spec", {}).get("containers", [{}])[0].get("env", [])
          print(next((e.get("value", "") for e in envs if e.get("name") == "BASE_MANAGER_API"), ""))
          PY
          )"
          if [[ -z "$deployed_base_manager_api" ]]; then
            echo "ERROR: BASE_MANAGER_API vacío en revisión STAGING desplegada."
            exit 1
          fi
          if [[ "$deployed_base_manager_api" == *"---"* ]]; then
            echo "ERROR: BASE_MANAGER_API STAGING quedó taggeada en deploy: $deployed_base_manager_api"
            exit 1
          fi
          if [[ "$deployed_base_manager_api" != "${{ steps.backend.outputs.BASE_MANAGER_API }}" ]]; then
            echo "ERROR: BASE_MANAGER_API STAGING desplegada no coincide con la URL canónica resuelta."
            echo "Esperada: ${{ steps.backend.outputs.BASE_MANAGER_API }}"
            echo "Actual:   $deployed_base_manager_api"
            exit 1
          fi

      - name: Resolve API URL (STAGING)
        run: |
          service_url="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE_FRONTEND_STG }}" \
            --project="${{ vars.GCP_PROJECT_ID_STG }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.url)')"
          if [[ -z "$service_url" ]]; then
            echo "ERROR: no se pudo resolver status.url del servicio frontend STAGING."
            exit 1
          fi
          echo "SERVICE_URL=$service_url" >> "$GITHUB_ENV"

      - name: Resolve Cloud Run revision (STAGING)
        run: |
          revision="$(gcloud run services describe "${{ vars.CLOUD_RUN_SERVICE_FRONTEND_STG }}" \
            --project="${{ vars.GCP_PROJECT_ID_STG }}" \
            --region="${{ env.REGION }}" \
            --format='value(status.latestReadyRevisionName)')"
          echo "CLOUD_RUN_REVISION=$revision" >> "$GITHUB_ENV"

      - name: Write Firebase target config (STAGING)
        run: |
          cat > .firebaserc <<EOF
          {
            "targets": {
              "${{ vars.GCP_PROJECT_ID_STG }}": {
                "hosting": {
                  "frontend": [
                    "${HOSTING_SITE_ID}"
                  ]
                }
              }
            }
          }
          EOF

      - name: Deploy UI to Firebase Hosting (STAGING)
        run: |
          npx -y firebase-tools@15.16.0 deploy \
            --only hosting:frontend \
            --project "${{ vars.GCP_PROJECT_ID_STG }}" \
            --non-interactive

      - name: Resolve Hosting URL (STAGING)
        run: |
          echo "HOSTING_URL=https://${HOSTING_SITE_ID}.web.app" >> "$GITHUB_ENV"

      - name: Resolve auth token for functional smoke (STAGING)
        run: |
          token="${SMOKE_AUTH_BEARER_TOKEN:-}"
          if [[ -z "$token" ]]; then
            echo "WARN: SMOKE_AUTH_BEARER_TOKEN no configurado; se ejecutará smoke no autenticado."
          else
            echo "::add-mask::$token"
            echo "AUTH_BEARER_TOKEN=$token" >> "$GITHUB_ENV"
          fi
        env:
          SMOKE_AUTH_BEARER_TOKEN: ${{ secrets.SMOKE_AUTH_BEARER_TOKEN_STG }}

      - name: Smoke API health (STAGING)
        run: |
          curl -fsS "$SERVICE_URL/health" >/dev/null

      - name: Smoke release checks (STAGING)
        run: |
          bash ./scripts/smoke_release.sh "$HOSTING_URL"
        env:
          AUTH_BEARER_TOKEN: ${{ env.AUTH_BEARER_TOKEN }}
          REQUIRE_AUTH_SMOKE: ${{ env.REQUIRE_AUTH_SMOKE }}

      - name: Record STAGING deployment
        run: |
          DEPLOY_DESCRIPTION="Frontend STAGING smoke OK ${DEPLOY_SHA}" \
          SERVICE_VERSION="$RELEASE_SERVICE_VERSION" \
          IMAGE_URI="$IMAGE_SHA" \
          python3 scripts/release/deployments.py record
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_ENV: staging
          DEPLOY_STATUS_LABEL: SMOKE_OK
          DEPLOY_STATE: success
          UI_ARTIFACT_RUN_ID: ${{ github.run_id }}

      - name: Show deployment URLs (STAGING)
        run: |
          echo "✅ Cloud Run STAGING API: $SERVICE_URL"
          echo "✅ Firebase Hosting STAGING: $HOSTING_URL"
